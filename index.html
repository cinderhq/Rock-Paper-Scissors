<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>class</title>
  <link rel="stylesheet" href="index.css" />
</head>

<body>
  <p class="title">Rock Paper Scissors </p>

  <button id="rock" class="emoji-button" >

    <img src="images/rock-emoji.png" alt="rock" width="50" height="50" class="emoji" />

  </button>

  <button id="paper" class="emoji-button" >

    <img src="images/paper-emoji.png" alt="paper" width="50" height="50" class="emoji" />

  </button>

  <button id="scissors" class="emoji-button" >

    <img src="images/scissors-emoji.png" alt="scissors" width="50" height="50" class="emoji" />

  </button>

  <p class="result"></p>
  <p class="move">
  </p>
  <p class="score"></p>

  <button id="reset" class="reset-button" onclick="reset()">Reset Score</button>
  <button id="autoplay" class="autoplay-button" onclick="toggleAutoplay()">Autoplay</button>
</body>



<script src="index.js"></script>
</body>

</html>
